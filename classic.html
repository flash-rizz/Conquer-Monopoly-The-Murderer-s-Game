            db.ref(`games/${roomCode}/players/${myName}/cash`).on('value', s => { 
                myCash = s.val() || 0; document.getElementById('display-cash-badge').innerText=`RM ${myCash}`; 
            });
            db.ref(`games/${roomCode}/log`).on('child_added', s => {

                d.className = "flex gap-2 text-xs border-b border-white/5 pb-1 mb-1 text-gray-400";
                d.innerHTML = `<span>${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span> <span class="text-white">${s.val()}</span>`;

        function triggerGlobalAlert(t, m, i="info") { db.ref(`games/${roomCode}/globalAlert`).set({ title: t, message: m, icon: i, timestamp: Date.now() }); }
        
        function listenForGlobalAlerts() {
            db.ref(`games/${roomCode}/globalAlert`).on('value', snap => {
                if(!snap.exists()) return;
                const data = snap.val();
                if (Date.now() - data.timestamp < 5000) {
                    if(data.icon !== "payments") document.getElementById('snd-alert').play().catch(e=>{});
                    showBigBox(data.title, data.message, data.icon);
                }
            });
            db.ref(`games/${roomCode}/players/${myName}/notification`).on('value', snap => {
                if(!snap.exists()) return;
                const data = snap.val();
                if (Date.now() - data.timestamp < 5000) {
                    document.getElementById('snd-cash').play().catch(e => {});
                    showBigBox("PAYMENT RECEIVED", data.message, "payments");
                }
            });
        }

                        const landId = parseInt(k);
                        const landInfo = LAND_DATA.find(l => l.id === landId);
                        if (landInfo) {
                            c.innerHTML += `<div class="bg-[#1a1a1a] wizard-border rounded-lg overflow-hidden mb-4 relative group"><div class="h-4 bg-app-accent w-full border-b border-[#d4af37]"></div><div class="p-4 text-center"><div class="text-xs text-gray-500 font-bold mb-1">LAND #${landId}</div><h4 class="font-bold text-lg text-white mb-1"><span class="text-app-accent mr-2">#${landId}</span>${landInfo.name}</h4><div class="flex justify-around text-xs text-gray-400 mt-2 border-t border-white/10 pt-2"><div><span class="block text-[#d4af37]">RENT</span>RM ${landInfo.rent}</div><div><span class="block text-[#d4af37]">1 HOUSE</span>RM ${landInfo.house}</div></div></div></div>`;
                        }
                    });
                } else c.innerHTML = '<div class="text-gray-500 text-center italic">No properties owned.</div>';
            });

            db.ref(`games/${roomCode}/players/${myName}/powerCards`).once('value', snap => {
                const c = document.getElementById('inventory-powers'); c.innerHTML = '';
                if(snap.exists()) {
                    const cards = snap.val();
                    Object.keys(cards).forEach(k => {
                        const cardData = cards[k];
                        c.innerHTML += `<button onclick="usePowerCard('${k}')" class="bg-[#2a2a2a] border border-amber-500/30 p-3 rounded-xl text-center hover:bg-amber-900/20"><div class="text-amber-500 font-bold text-sm">${cardData.en}</div><div class="text-[10px] text-gray-400 italic">${cardData.bm}</div><div class="text-[10px] text-gray-500 uppercase mt-1">Tap to Use</div></button>`;
                    });
                } else c.innerHTML = '<div class="col-span-2 text-gray-500 text-center italic">No Action Cards.</div>';
            });
        }
        function closeInventory() { document.getElementById('modal-inventory').classList.add('hidden'); document.getElementById('modal-inventory').classList.remove('flex'); }
        
        function usePowerCard(k) {
            const cardRef = db.ref(`games/${roomCode}/players/${myName}/powerCards/${k}`);
            cardRef.once('value', snap => {
                if (!snap.exists()) return;
                const cardData = snap.val();
                if(confirm(`Use card "${cardData.en}"?`)) {
                    cardRef.remove();
                    triggerGlobalAlert("CARD PLAYED", `${myName} used ${cardData.en}!`, "auto_fix_high");
                    logEvent(`⚡ ${myName} used ${cardData.en}`);
                    closeInventory();
                }
            });
        }

        function performAction(t) {
            if(t === 'land') {
                const n = parseInt(prompt("Enter Land # (1-28):"));
                if(!n || n < 1 || n > 28) return alert("Invalid Land #");
                const land = LAND_DATA.find(l => l.id === n);
                if(confirm(`Buy ${land.name}?\nPrice: RM ${land.price}`)) {
                    const ref = db.ref(`games/${roomCode}/ownership/${n}`);
                    ref.once('value', s => {
                        if(s.exists()) return alert(`Owned by ${s.val()}!`);
                        if (myCash < land.price) return alert("Not enough money!");
                        
                        db.ref(`games/${roomCode}/players/${myName}/cash`).set(myCash - land.price);
                        ref.set(myName);
                        db.ref(`games/${roomCode}/players/${myName}/lands/${n}`).set(true);
                        triggerGlobalAlert("PROPERTY BOUGHT", `${myName} bought ${land.name}!`, "flag");
                        logEvent(`${myName} bought ${land.name}`);
                    });
                }
            } else if(t === 'bank') {
                const a = parseInt(prompt("Amount (- to pay, + to receive):"));
                if(a) { 
                    db.ref(`games/${roomCode}/players/${myName}/cash`).set(myCash+a); 
                    logEvent(`${myName} ${a>0?'received':'paid'} RM ${Math.abs(a)} from/to Bank`); 
                }
            } else if(t === 'chest') {
                const pick = CHEST_CARDS[Math.floor(Math.random()*CHEST_CARDS.length)];
                alert(`${pick.en}\n\n${pick.bm}`);
                if(pick.type === "drawPower") performAction('power');
                logEvent(`${myName} drew Chest: ${pick.en}`);
            } else if(t === 'power') {
                const pick = POWER_CARDS[Math.floor(Math.random()*POWER_CARDS.length)];
                alert(`Card: ${pick.en}\n\n${pick.bm}`);
                db.ref(`games/${roomCode}/players/${myName}/powerCards`).push(pick);
            } else if (t === 'challenge') {
                const c = CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];
                alert(`CHALLENGE:\n${c.en}\n\n${c.bm}`);
                logEvent(`${myName} Challenge: ${c.en}`);
            }
        }

        function openPlayerSelect(cb, t="Select") {
            playerSelectCallback = cb; document.getElementById('player-select-title').innerText = t;
            const l = document.getElementById('player-list-container'); l.innerHTML = 'Loading...';
            document.getElementById('modal-player-select').classList.remove('hidden'); document.getElementById('modal-player-select').classList.add('flex');
            db.ref(`games/${roomCode}/players`).once('value', s => {
                l.innerHTML = '';
                s.forEach(c => {
                    if(c.key !== myName) {
                        const b = document.createElement('button');
                        b.className = "w-full bg-[#27272a] p-4 rounded-xl flex justify-between items-center mb-2 hover:bg-white/5";
                        b.innerHTML = `<span class="font-bold text-white">${c.key}</span><span class="material-icons-round text-purple-500">chevron_right</span>`;
                        b.onclick = () => { closePlayerSelect(); if(playerSelectCallback) playerSelectCallback(c.key); };
                        l.appendChild(b);
                    }
                });
            });
        }
        function closePlayerSelect() { document.getElementById('modal-player-select').classList.add('hidden'); document.getElementById('modal-player-select').classList.remove('flex'); }
        
        function performPay(targetPlayer) {
            const amount = parseInt(prompt(`Pay ${targetPlayer} amount:`));
            if (amount && myCash >= amount) {
                updatePlayerCash(myName, -amount);
                updatePlayerCash(targetPlayer, amount);
                db.ref(`games/${roomCode}/players/${targetPlayer}/notification`).set({ message: `Received RM ${amount} from ${myName}`, timestamp: Date.now() });
                logEvent(`${myName} paid RM ${amount} to ${targetPlayer}`);
            } else if (amount) {
                alert("Not enough cash!");
            }
        }

        function performSteal(targetPlayer) {
            db.ref(`games/${roomCode}/players/${targetPlayer}/lands`).once('value', snap => {
                if (!snap.exists() || snap.numChildren() === 0) {
                    alert(`${targetPlayer} has no lands to steal.`);
                    return;
                }
                const lands = snap.val();
                const landIds = Object.keys(lands);
                const landId = parseInt(prompt(`Select a land to steal:\n${landIds.join(', ')}`));
                if (!landIds.includes(String(landId))) {
                    alert("Invalid land selection.");
                    return;
                }
                db.ref(`games/${roomCode}/ownership/${landId}`).set(myName);
                db.ref(`games/${roomCode}/players/${myName}/lands/${landId}`).set(true);
                removeLandFromPlayer(targetPlayer, landId);
                triggerGlobalAlert("LAND STOLEN", `${myName} stole land #${landId} from ${targetPlayer}!`, "handyman");
                logEvent(`🔴 ${myName} stole land #${landId} from ${targetPlayer}`);
            });
        }

        function checkElimination(playerId) {
            db.ref(`games/${roomCode}/players/${playerId}`).once('value', snap => {
                const player = snap.val();
                if (player.cash === 0 && (!player.lands || Object.keys(player.lands).length === 0)) {
                    db.ref(`games/${roomCode}/players/${playerId}/status`).set("Dead");
                    triggerGlobalAlert("PLAYER ELIMINATED", `${playerId} has been eliminated!`, "sentiment_very_dissatisfied");
                    logEvent(`💀 ${playerId} was eliminated due to bankruptcy.`);
                }
            });
        }

        // Update cash and check elimination
        function updatePlayerCash(playerId, amount) {
            db.ref(`games/${roomCode}/players/${playerId}/cash`).transaction(cash => {
                const newCash = (cash || 0) + amount;
                return newCash < 0 ? 0 : newCash;
            }, () => {
                checkElimination(playerId);
                checkWinCondition();
            });
        }

        // Call checkElimination after land is removed
        function removeLandFromPlayer(playerId, landId) {
            db.ref(`games/${roomCode}/players/${playerId}/lands/${landId}`).remove(() => {
                checkElimination(playerId);
                checkWinCondition();
            });
        }

        function performCompete() {
            const pick = COMPETE_CARDS[Math.floor(Math.random() * COMPETE_CARDS.length)];
            alert(`COMPETE:\n${pick.en}\n\n${pick.bm}`);
            logEvent(`${myName} competed: ${pick.en}`);
        }

        function reviveAndReturn() {
            db.ref(`games/${roomCode}/players/${myName}/status`).set("Alive");
            document.getElementById('eliminated-overlay').classList.add('hidden');
            document.getElementById('eliminated-overlay').classList.remove('flex');
            triggerGlobalAlert("REVIVED", `${myName} has returned to the game!`, "favorite");
            logEvent(`💖 ${myName} revived and returned to the game.`);
        }

        function checkWinCondition() {
            db.ref(`games/${roomCode}/players`).once('value', snap => {
                let aliveCount = 0, totalCash = 0, totalLands = 0, allLandsOwned = true;
                snap.forEach(p => {
                    const player = p.val();
                    if (player.status !== "Dead") aliveCount++;
                    totalCash += player.cash || 0;
                    totalLands += player.lands ? Object.keys(player.lands).length : 0;
                    if (!player.lands || Object.keys(player.lands).length === 0) allLandsOwned = false;

                    // Check if any player has reached RM 40,000
                    if (player.cash >= 40000) {
                        triggerGlobalAlert("VICTORY", `${p.key} has won by reaching RM 40,000!`, "emoji_events");
                        logEvent(`🏆 GAME OVER: ${p.key} achieved cash victory.`);
                        return;
                    }
                });

                if (aliveCount === 1) {
                    triggerGlobalAlert("GAME OVER", `${myName} is the last player standing!`, "emoji_events");
                    logEvent("🏆 GAME OVER: Last player standing.");
                } else if (allLandsOwned) {
                    triggerGlobalAlert("VICTORY", `${myName} has won by acquiring all lands!`, "emoji_events");
                    logEvent("🏆 GAME OVER: Land ownership victory.");
                }
            });
        }

        function logEvent(m) { db.ref(`games/${roomCode}/log`).push(m); }
        function confirmExit() { if(confirm("Exit game?")) window.location.href = 'index.html'; }
    </script>
</body>
</html>
